# ---------------------------------------------------------------------------
# Overlay SOA: servicio Laravel (panel + integración) sobre el compose de prod.
#
# Uso:
#   docker compose --env-file .env.production --env-file .env.soa \
#     -f docker-compose.prod.yml -f docker-compose.soa.yml up -d --build
# ---------------------------------------------------------------------------

x-laravel-common: &laravel-common
  build:
    context: ./laravel
    dockerfile: Dockerfile
  image: tanish-laravel:latest
  restart: unless-stopped
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_started
  environment:
    APP_ENV: production
    APP_DEBUG: "false"
    APP_KEY: ${LARAVEL_APP_KEY:?LARAVEL_APP_KEY is required}
    APP_URL: ${LARAVEL_URL:?LARAVEL_URL is required}
    APP_TIMEZONE: America/Lima
    LOG_CHANNEL: stderr
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: "3306"
    DB_DATABASE: ${LARAVEL_DB_DATABASE:-tanish_laravel}
    DB_USERNAME: ${LARAVEL_DB_USERNAME:-tanish_laravel}
    DB_PASSWORD: ${LARAVEL_DB_PASSWORD:?LARAVEL_DB_PASSWORD is required}
    CACHE_STORE: redis
    QUEUE_CONNECTION: redis
    SESSION_DRIVER: redis
    SESSION_SECURE_COOKIE: "true"
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    REDIS_CLIENT: predis
    WOOCOMMERCE_URL: ${WOOCOMMERCE_URL:-http://wordpress:80}
    WOOCOMMERCE_KEY: ${WOOCOMMERCE_KEY:?WOOCOMMERCE_KEY is required}
    WOOCOMMERCE_SECRET: ${WOOCOMMERCE_SECRET:?WOOCOMMERCE_SECRET is required}
    WOOCOMMERCE_WEBHOOK_SECRET: ${WOOCOMMERCE_WEBHOOK_SECRET:?WOOCOMMERCE_WEBHOOK_SECRET is required}
    WOOCOMMERCE_VERIFY: "false"
    GA4_MEASUREMENT_ID: ${GA4_MEASUREMENT_ID:-}
    GA4_API_SECRET: ${GA4_API_SECRET:-}
    WHATSAPP_DRIVER: ${WHATSAPP_DRIVER:-webhook}
    WHATSAPP_NOTIFY_URL: ${WHATSAPP_NOTIFY_URL:-}
    WHATSAPP_NOTIFY_TOKEN: ${WHATSAPP_NOTIFY_TOKEN:-}
    WHATSAPP_ADMIN_NUMBER: ${WHATSAPP_ADMIN_NUMBER:-}
    WHATSAPP_META_TOKEN: ${WHATSAPP_META_TOKEN:-}
    WHATSAPP_META_PHONE_ID: ${WHATSAPP_META_PHONE_ID:-}
    WHATSAPP_TEMPLATE_NAME: ${WHATSAPP_TEMPLATE_NAME:-}
    WHATSAPP_TEMPLATE_LANG: ${WHATSAPP_TEMPLATE_LANG:-es}
    TANISH_STORE_URL: ${TANISH_STORE_URL:-https://tanish-proxy.solvegrades.workers.dev}
    TANISH_WHATSAPP_NUMBER: ${TANISH_WHATSAPP_NUMBER:-51975852932}
    TANISH_ADMIN_USERNAME: ${TANISH_ADMIN_USERNAME:-tanish_admin}
    TANISH_ADMIN_EMAIL: ${TANISH_ADMIN_EMAIL:-tanish_admin@tanish.local}
    TANISH_ADMIN_PASSWORD: ${TANISH_ADMIN_PASSWORD:-}
  networks:
    - tanish-network

services:
  laravel:
    <<: *laravel-common
    container_name: tanish-laravel
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/up >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  laravel-queue:
    <<: *laravel-common
    container_name: tanish-laravel-queue
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=5", "--timeout=90"]

  laravel-scheduler:
    <<: *laravel-common
    container_name: tanish-laravel-scheduler
    command: ["php", "artisan", "schedule:work"]

  redis:
    image: redis:7-alpine
    container_name: tanish-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    networks:
      - tanish-network

  mysql:
    volumes:
      - ./docker/mysql-init-soa.sh:/docker-entrypoint-initdb.d/10-laravel.sh:ro
    environment:
      LARAVEL_DB_DATABASE: ${LARAVEL_DB_DATABASE:-tanish_laravel}
      LARAVEL_DB_USERNAME: ${LARAVEL_DB_USERNAME:-tanish_laravel}
      LARAVEL_DB_PASSWORD: ${LARAVEL_DB_PASSWORD:?LARAVEL_DB_PASSWORD is required}

  caddy:
    environment:
      CADDY_ADMIN_DOMAIN: ${CADDY_ADMIN_DOMAIN:?CADDY_ADMIN_DOMAIN is required}
    volumes:
      # Se agrega un snippet al Caddyfile existente (no se reemplaza).
      - ./caddy/sites:/etc/caddy/sites:ro

volumes:
  redis_data:
    name: tanish_redis_data
