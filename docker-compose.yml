services:
  mysql:
    image: mysql:8.0
    container_name: tanish-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - tanish-network

  wordpress:
    image: wordpress:latest
    container_name: tanish-wordpress
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: ${WORDPRESS_DB_HOST}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
    volumes:
      - wordpress_data:/var/www/html
      - ./plugins/tanish-inventory:/var/www/html/wp-content/plugins/tanish-inventory
      - ./themes/tanish-storefront:/var/www/html/wp-content/themes/tanish-storefront
    networks:
      - tanish-network

volumes:
  mysql_data:
    name: tanish_mysql_data
  wordpress_data:
    name: tanish_wordpress_data

networks:
  tanish-network:
    name: tanish-network
    driver: bridge
